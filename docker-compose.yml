services:
   php-env:
      build: .
      container_name: app_server
      volumes:
         - ./src:/var/www/html
      ports:
         - "9000:80"
      depends_on:
         - mysql_db

   mysql_db:
      image: mysql:latest
      container_name: db_server
      environment:
         MYSQL_ROOT_PASSWORD: root
         MYSQL_DATABASE: db_food_festive

   phpmyadmin:
      image: phpmyadmin/phpmyadmin:latest
      container_name: dbms_software
      environment:
         PMA_HOST: mysql_db
         PMA_USER: root
         PMA_PASSWORD: root
      ports:
         - "9001:80"
      depends_on:
         - mysql_db
